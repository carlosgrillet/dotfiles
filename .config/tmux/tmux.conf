set -g default-terminal "tmux-256color"
set -su terminal-features
set -as terminal-features ",xterm*:RGB"
# action key
unbind C-b
set-option -g prefix C-t
# Repeatable movement and resizing
# set-option -g repeat-time 500
set-option -g focus-events on

# base index for windows 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

#### Key bindings

set-window-option -g mode-keys vi

# Reload settings
bind r run-shell "tmux source-file ~/.config/tmux/tmux.conf && tmux display-message 'Reloaded!' || tmux display-message 'Reload failed'"

# Open current directory
bind o run-shell -b 'open #{q:pane_current_path}'
bind -r e kill-pane -a

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Alt+hjkl pane switching (no prefix)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Alt splits / window / kill (no prefix)
bind-key -n M-s split-window -v -c "#{pane_current_path}"
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-c new-window -c "#{pane_current_path}"
bind-key -n M-d detach-client
bind-key -n M-x kill-pane
bind-key -n M-n copy-mode

# Switch windows with Alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

#### basic settings

# look'n feel
set-option -g history-limit 64096

set -sg escape-time 10

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf
